<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodLoop | Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0faf4, #e7f7ed);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Login Box */

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0, 90, 55, 0.12);
            border: 1px solid #e5f1e9;
        }

        /* Logo */

        .foodloop-brand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .foodloop-logo-icon {
            width: 52px;
            height: 52px;
            background: #e8f7ee;
            border: 2px solid #b8e6c8;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        .foodloop-logo-text h2 {
            margin: 0;
            color: #087443;
            font-size: 27px;
            font-weight: 800;
        }

        .foodloop-logo-text span {
            display: block;
            margin-top: 3px;
            color: #718078;
            font-size: 11px;
        }

        /* Heading */

        .login-card h1 {
            text-align: center;
            margin: 0;
            color: #18352a;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #718078;
            margin: 8px 0 30px;
            font-size: 14px;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #29483b;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d5e5dc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: #fbfdfc;
        }

        .form-group input:focus {
            border-color: #15965b;
            box-shadow: 0 0 0 3px rgba(21, 150, 91, 0.10);
            background: white;
        }

        /* Login Button */

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;

            background: #087443;
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
            transition: 0.2s;

            margin-top: 5px;
        }

        .login-btn:hover {
            background: #065d36;
            transform: translateY(-1px);
        }

        /* Register */

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #718078;
            font-size: 14px;
        }

        .register-text a {
            color: #087443;
            font-weight: 700;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* Error */

        .error-message {
            background: #fff1f1;
            color: #c62828;
            border: 1px solid #ffd0d0;
            padding: 11px 14px;
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        /* Mobile */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .login-card h1 {
                font-size: 24px;
            }

        }

    </style>
</head>


<body>

    <div class="login-wrapper">

        <div class="login-card">

            <!-- FoodLoop Logo -->

            <div class="foodloop-brand">

                <div class="foodloop-logo-icon">
                    🌿
                </div>

                <div class="foodloop-logo-text">
                    <h2>FoodLoop</h2>
                    <span>Share Food • Reduce Waste</span>
                </div>

            </div>


            <!-- Heading -->

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your FoodLoop account
            </p>


            <!-- Error Message -->

            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}


            <!-- Login Form -->

            <form method="POST">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn">
                    Login
                </button>

            </form>


            <!-- Register -->

            <div class="register-text">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</body>

</html>
